name: Release

on:
  push:
    tags:
      - 'v*.*.*'

# Publishes BOTH packages (ADR-17): the driver ModelingEvolution.GenericAxis, a NuGet library in its
# own right, and the rw2 plugin ModelingEvolution.GenericAxis.Plugin, whose nuspec depends on it.
# The staged plugin zip carries both dlls, so a cell that installs from the zip needs no feed.
#
# nuget.org is pushed via Trusted Publishing (GitHub OIDC -> NuGet/login -> a 1-hour API key); this
# repo holds no long-lived nuget.org key. Two prerequisites, both owner-set, outside this file:
#   1. Repository variable NUGET_USER: the nuget.org USERNAME of the person who CREATED the policy
#      below (today `rafal.maciag`) -- NOT the owning organization `ModelingEvolution`. nuget.org's
#      rule, from the 401 on the first run: "Make sure you are using the username of the policy
#      creator, not the policy owner." If the creator leaves the org the policy goes inactive; a
#      member must recreate it and set NUGET_USER to their own username. The push step refuses by
#      name if it is unset.
#   2. The nuget.org Trusted Publishing policy, as created: owner organization `ModelingEvolution`,
#      Repository Owner `modelingevolution`, Repository `generic-axis`, Workflow File
#      `publish-nuget.yml` (this file's name; the OIDC exchange is refused on a mismatch, so never
#      rename this file without changing the policy), no environment, scope push new packages and
#      versions, package glob `*`.
# The internal feed (nuget.modelingevolution.com, secret NUGET_API_KEY_ME) is unaffected.

jobs:
  publish:
    runs-on: ubuntu-latest
    # Setting any permission drops the rest to none, so this is the job's whole need: checkout reads
    # contents, the GitHub release writes contents, NuGet/login requests the OIDC token.
    permissions:
      contents: write
      id-token: write
    env:
      PLUGIN_ID: ModelingEvolution.GenericAxis.Plugin
      DRIVER_ID: ModelingEvolution.GenericAxis
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Inject version
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # AssemblyVersion/FileVersion must be numeric, so strip any prerelease suffix
          # (1.1.0-preview.1 -> 1.1.0). <Version>, the NuGet package version, keeps the full string.
          NUMERIC="${VERSION%%-*}"
          # src/Directory.Build.props is the single source of version metadata; no csproj carries one.
          sed -i "s|<Version>1.0.0</Version>|<Version>${VERSION}</Version>|g" src/Directory.Build.props
          sed -i "s|<AssemblyVersion>1.0.0</AssemblyVersion>|<AssemblyVersion>${NUMERIC}.0</AssemblyVersion>|g" src/Directory.Build.props
          sed -i "s|<FileVersion>1.0.0</FileVersion>|<FileVersion>${NUMERIC}.0</FileVersion>|g" src/Directory.Build.props
          grep -n "Version>" src/Directory.Build.props
          grep -q "<Version>${VERSION}</Version>" src/Directory.Build.props \
            || { echo "::error::version injection did not land in src/Directory.Build.props"; exit 1; }

      - name: Restore
        run: dotnet restore src/GenericAxis.sln

      - name: Build
        run: dotnet build src/GenericAxis.sln --no-restore --configuration Release

      # A hung test must not hold the runner for the 6 h default (#42): the blame collector dumps a
      # test host stuck for 10 min, and the step is cut at 25 min either way.
      - name: Test
        timeout-minutes: 25
        run: |
          dotnet test src/GenericAxis.sln --no-build --configuration Release \
            --blame-hang-timeout 10m --blame-hang-dump-type mini \
            --results-directory TestResults --logger trx

      # #43: a timing test whose fixture missed its scan cadence is an xunit skip whose reason starts
      # "INCONCLUSIVE", and dotnet test exits 0. A tag is a claim, so any INCONCLUSIVE fails the
      # release; fix the runner or the fixture, do not re-run to green.
      - name: Refuse INCONCLUSIVE results
        run: python3 .github/scripts/inconclusive.py gate TestResults "$(find src -name '*.Tests.csproj' | wc -l)"

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-blame-release
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore

      - name: Pack driver and plugin
        run: |
          dotnet pack "src/$DRIVER_ID/$DRIVER_ID.csproj" --configuration Release --no-build --output ./nupkg
          dotnet pack "src/$PLUGIN_ID/$PLUGIN_ID.csproj" --configuration Release --no-build --output ./nupkg
          ls -1 ./nupkg

      - name: Verify the plugin package depends on the driver package
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # ADR-17: the driver reaches a NuGet consumer as a dependency, never embedded. A dependency
          # missing here means a feed install would load the plugin without its driver.
          unzip -p "./nupkg/$PLUGIN_ID.$VERSION.nupkg" "$PLUGIN_ID.nuspec" > plugin.nuspec
          grep -q "id=\"$DRIVER_ID\" version=\"$VERSION\"" plugin.nuspec \
            || { echo "::error::$PLUGIN_ID.nuspec has no dependency on $DRIVER_ID $VERSION"; cat plugin.nuspec; exit 1; }
          if unzip -l "./nupkg/$PLUGIN_ID.$VERSION.nupkg" | grep -q "lib/.*/$DRIVER_ID.dll"; then
            echo "::error::$DRIVER_ID.dll is embedded in the plugin package; it must be a dependency only"
            exit 1
          fi
          echo "plugin -> $DRIVER_ID $VERSION dependency present, not embedded"

      # The staged zip is what rw2 consumes, so it is built and released BEFORE any feed push: an
      # unreachable feed or a missing secret must not cost the release its artifact.
      - name: Publish plugin closure (framework-dependent)
        run: |
          dotnet publish "src/$PLUGIN_ID/$PLUGIN_ID.csproj" --configuration Release --output publish/plugin

      # ── STRIP WHAT THE HOST SHIPS, KEEP EVERYTHING ELSE ────────────────────────────────────────
      #
      # rw2's PluginLoader loads a plugin into the default load context. Its Resolving handler returns
      # the host's resident copy for any assembly the host ships, and probes this folder only for what
      # the host does not have. So an assembly the host ships is dead weight here, and an assembly it
      # does not ship must survive or the plugin fails at load on a cell.
      #
      # The strip patterns are globs, so a future dependency could match one by name without being a
      # host assembly. The KEEP list is checked before any file is removed. When adding a dependency,
      # ask one question: does the rw2 host reference this package? Yes -> it may be stripped.
      # No -> it must survive, and belongs in KEEP if any pattern could match it.
      - name: Stage plugin folder
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          cd publish/plugin

          # Assemblies this plugin needs and the host does NOT ship.
          KEEP="$PLUGIN_ID $DRIVER_ID FluentModbus"

          strip() {
            for f in $1; do
              [ -e "$f" ] || continue
              base="${f%.dll}"
              case " $KEEP " in
                *" $base "*) echo "keep   $base"; continue ;;
              esac
              echo "strip  $base"
              rm -f "$base.dll" "$base.pdb" "$base.xml"
            done
          }

          # Host-shipped assemblies (design.md § Plugin, Release).
          strip 'RocketWelder.SDK*.dll'
          strip 'ModelingEvolution.Drawing*.dll'
          strip 'ModelingEvolution.Signals*.dll'
          strip 'MicroPlumberd*.dll'
          strip 'MudBlazor*.dll'
          # App-specific runtime config: meaningless inside a loadable plugin closure.
          rm -f *.runtimeconfig.json

          cd ../..
          # Layout PluginLoader discovers by: plugins/<id>/<version>/<id>.dll
          mkdir -p "staging/plugins/$PLUGIN_ID/$VERSION"
          cp -a publish/plugin/. "staging/plugins/$PLUGIN_ID/$VERSION/"

      - name: Verify the staged closure is loadable
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          DIR="staging/plugins/$PLUGIN_ID/$VERSION"

          # Each of these is an assembly the host does not provide; its absence is a load failure.
          for required in "$PLUGIN_ID.dll" "$DRIVER_ID.dll" "FluentModbus.dll"; do
            if [ ! -f "$DIR/$required" ]; then
              echo "::error::$required is missing from the staged closure: either publish did not produce it or the strip step removed an assembly the host does not ship."
              exit 1
            fi
            echo "present  $required"
          done

          # And the converse: nothing from a stripped family may be left behind. The host's copy wins
          # at load, so a leftover shadows nothing and only confuses; a leftover also means the strip
          # patterns and this list have drifted apart. Same families as the strip step.
          shopt -s nullglob
          for pattern in 'RocketWelder.SDK*' 'ModelingEvolution.Drawing*' 'ModelingEvolution.Signals*' \
                         'MicroPlumberd*' 'MudBlazor*' '*.runtimeconfig.json'; do
            left=( "$DIR"/$pattern )
            if [ ${#left[@]} -gt 0 ]; then
              echo "::error::$pattern should have been stripped — the host serves it: ${left[*]}"
              exit 1
            fi
            echo "absent   $pattern"
          done
          shopt -u nullglob

          echo "--- staged closure ---"
          ls -1 "$DIR"

      - name: Package staged plugin as zip
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          (cd staging && zip -r "../GenericAxis.Plugin-${VERSION}.zip" plugins/)
          unzip -l "GenericAxis.Plugin-${VERSION}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: GenericAxis.Plugin-${{ steps.ver.outputs.version }}.zip
          generate_release_notes: true

      - name: Push to ModelingEvolution NuGet
        # The org feed has no public ingress for GitHub-hosted runners. Bounded and allowed to fail;
        # nuget.org below is the publish that matters from CI.
        timeout-minutes: 2
        continue-on-error: true
        run: |
          # Driver first, as on nuget.org below: rw2's plugin update resolves the plugin's nuspec
          # dependencies from the feed.
          for id in "$DRIVER_ID" "$PLUGIN_ID"; do
            dotnet nuget push "./nupkg/$id.${{ steps.ver.outputs.version }}.nupkg" \
              --api-key ${{ secrets.NUGET_API_KEY_ME }} \
              --source https://nuget.modelingevolution.com/v3/index.json \
              --timeout 60 --skip-duplicate
          done

      # Checked explicitly: an unset variable otherwise reaches NuGet/login as an empty user and comes
      # back as an opaque token-exchange failure, which reads like a broken policy rather than a missing
      # setting.
      - name: Require NUGET_USER
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Repository variable NUGET_USER is not set (the nuget.org username of the person who CREATED this repo's Trusted Publishing policy, not the owning org). The release zip is already published; only the nuget.org push is missing. Set the variable and re-run this job."
            exit 1
          fi

      # Immediately before the push: the key it returns lives one hour, one OIDC token buys one key.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1 (v1.2.0)
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to NuGet.org
        env:
          NUGET_ORG_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          # Driver first: the plugin's nuspec depends on it, so a consumer resolving the plugin the
          # moment it indexes must find the driver already there.
          dotnet nuget push "./nupkg/$DRIVER_ID.${{ steps.ver.outputs.version }}.nupkg" \
            --api-key "$NUGET_ORG_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          dotnet nuget push "./nupkg/$PLUGIN_ID.${{ steps.ver.outputs.version }}.nupkg" \
            --api-key "$NUGET_ORG_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
