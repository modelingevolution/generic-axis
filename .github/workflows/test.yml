name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/GenericAxis.sln

      - name: Build
        run: dotnet build src/GenericAxis.sln --no-restore --configuration Release

      # A hung test must not hold the runner for the 6 h default (#42): the blame collector dumps a
      # test host stuck for 10 min, and the step is cut at 25 min either way.
      - name: Test
        timeout-minutes: 25
        run: |
          dotnet test src/GenericAxis.sln --no-build --configuration Release --logger "console;verbosity=normal" \
            --blame-hang-timeout 10m --blame-hang-dump-type mini \
            --results-directory TestResults

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-blame
          path: |
            TestResults/**/*.dmp
            TestResults/**/Sequence_*.xml
          if-no-files-found: ignore
