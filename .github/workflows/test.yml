name: Tests

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/GenericAxis.sln

      - name: Build
        run: dotnet build src/GenericAxis.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test src/GenericAxis.sln --no-build --configuration Release --logger "console;verbosity=normal"
